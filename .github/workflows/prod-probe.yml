name: Probe production build

# Probes which build is live on Railway by requesting files that only exist
# in newer builds. Fire it by committing a timestamp to .github/probe-request
# on a work branch (the GitHub App cannot use workflow_dispatch). No secrets.
on:
  push:
    branches-ignore: [main]
    paths: ['.github/probe-request']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployment
        run: |
          BASE="https://branchline-production.up.railway.app"
          probe() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$1" || echo ERR)
            echo "$1 -> $code"
          }
          probe "/"
          # Present only in the merged build (new 10-scene example board):
          probe "/scenes/ads-art/scene-01.webp"
          probe "/scenes/ads-art/scene-01-draft.mp4"
          # Present since the previous build (DP-shot-list stills):
          probe "/example/scene-01.jpg"
